[project]
name = "quackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jaco Stroebel", email = "jaco@gremble.xyz" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pylatexenc>=2.11",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.50.0",
]

[project.scripts]
quackathon = "quackathon:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
